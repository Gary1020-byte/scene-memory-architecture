<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1155" viewBox="0 0 1280 1155">
<defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif; }
      .t { font-weight: 700; fill: #0f172a; }
      .b { fill: #475569; }
      .m { fill: #94a3b8; }
      .cap { font-weight: 600; }
      .sep { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
<rect width="1280" height="1155" fill="#f8fafc"/>
<rect width="1280" height="1155" fill="url(#grid)"/>
<text x="48" y="58" font-size="34" class="t">場景記憶架構 · 拓撲總覽</text>
<text x="48" y="88" font-size="16" class="b">節點 = 東西放在哪一層；連線 = 誰讀誰、誰寫誰</text>
<text x="1224" y="88" font-size="15" fill="#94a3b8" text-anchor="end">※ 層號 = 歸屬層級（見總綱「七層」表）｜主資料流 L0 → L2 → L1 → L3 ↓（C6 回執例外）</text>

<!-- L0 全域憲法 -->
<rect x="440" y="105" width="400" height="92" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="440" y="105" width="6" height="92" rx="3" fill="#2563eb"/>
<text x="464" y="139" font-size="21" class="t">L0 全域憲法</text>
<text x="464" y="165" font-size="16" class="b">記憶在檔案裡 · 場景主權 · 一次派單＝一條回執</text>
<text x="464" y="186" font-size="14" fill="#b45309" font-weight="600">· 沒有可累積物的回執＝這次活白做</text>
<path d="M640 197 V225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="654" y="218" font-size="15" class="cap" fill="#2563eb">C1 注入（每輪）</text>

<!-- L2 場景私有層 -->
<rect x="440" y="225" width="400" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="440" y="225" width="6" height="240" rx="3" fill="#7c3aed"/>
<text x="464" y="255" font-size="21" class="t">L2 場景私有層</text>
<text x="464" y="279" font-size="16" class="b">每個場景 = 一個獨立 git 倉庫（.git 劃界）</text>

<g>
  <rect x="464" y="292" width="112" height="148" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <path d="M474 292H566a10 10 0 0 1 10 10v6H464v-6a10 10 0 0 1 10-10z" fill="#7c3aed"/>
  <text x="520" y="313" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">場景 A</text>
  <text x="476" y="340" font-size="14" class="b">· 憲法</text>
  <text x="476" y="364" font-size="14" class="b">· 專屬技能</text>
  <text x="476" y="388" font-size="14" class="b">· §₀ 交接</text>
  <text x="476" y="412" font-size="14" class="b">· 專案記憶</text>
</g>
<g>
  <rect x="584" y="292" width="112" height="148" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <path d="M594 292H686a10 10 0 0 1 10 10v6H584v-6a10 10 0 0 1 10-10z" fill="#7c3aed"/>
  <text x="640" y="313" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">場景 B</text>
  <text x="596" y="340" font-size="14" class="b">· 憲法</text>
  <text x="596" y="364" font-size="14" class="b">· 專屬技能</text>
  <text x="596" y="388" font-size="14" class="b">· §₀ 交接</text>
  <text x="596" y="412" font-size="14" class="b">· 專案記憶</text>
</g>
<g>
  <rect x="704" y="292" width="112" height="148" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <path d="M714 292H806a10 10 0 0 1 10 10v6H704v-6a10 10 0 0 1 10-10z" fill="#7c3aed"/>
  <text x="760" y="313" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">場景 C</text>
  <text x="716" y="340" font-size="14" class="b">· 憲法</text>
  <text x="716" y="364" font-size="14" class="b">· 專屬技能</text>
  <text x="716" y="388" font-size="14" class="b">· §₀ 交接</text>
  <text x="716" y="412" font-size="14" class="b">· 專案記憶</text>
</g>
<text x="464" y="456" font-size="15" fill="#7c3aed" font-weight="600">⛔ 只寫自己的；要動別人的，只能發請求</text>

<!-- 左上：邊界是事實 -->
<rect x="56" y="225" width="330" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="56" y="225" width="6" height="240" rx="3" fill="#0284c7"/>
<text x="80" y="255" font-size="19" class="t">邊界是事實，不是承諾</text>
<text x="80" y="288" font-size="15" class="b">引擎從 cwd 往上找第一個含 .git 的目錄</text>
<text x="80" y="312" font-size="15" class="b">＝ 專案根，只載入這棵樹的憲法與技能</text>
<text x="80" y="336" font-size="15" class="b">別的場景的東西不在掃描範圍裡</text>
<text x="80" y="368" font-size="14" fill="#0284c7" font-weight="600">模型「看不到」別的場景 ⇒ 無從越界</text>
<line x1="80" y1="388" x2="362" y2="388" class="sep"/>
<text x="80" y="416" font-size="15" class="b">用結構消除錯誤，</text>
<text x="80" y="440" font-size="15" class="b">而不是用提示詞請求正確。</text>
<path d="M386 300 H434" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arS)"/>

<!-- 右上：git 倉庫 -->
<rect x="894" y="225" width="330" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="894" y="225" width="6" height="240" rx="3" fill="#b45309"/>
<text x="918" y="255" font-size="19" class="t">每個場景 = 一個 git 倉庫</text>
<text x="918" y="288" font-size="15" class="b">.git/ 就是場景邊界，同時是稽核層</text>
<text x="918" y="312" font-size="15" class="b">每次改動能 diff、能追責、能回滾</text>
<text x="918" y="336" font-size="15" class="b">主權規則 + 獨立倉庫 = 不會互踩</text>
<text x="918" y="368" font-size="14" fill="#b45309" font-weight="600">記憶 = 有版本控制的資產</text>
<line x1="918" y1="388" x2="1200" y2="388" class="sep"/>
<text x="918" y="416" font-size="15" class="b">專案記憶：一專案一份，≤ 8 KB</text>
<text x="918" y="440" font-size="15" class="b">主檔案 ≤ 25 KB，超了搬進歸檔</text>
<path d="M894 300 H846" stroke="#b45309" stroke-width="2.5" marker-end="url(#arA)"/>

<!-- C4 -->
<path d="M640 465 V500" stroke="#059669" stroke-width="2.5" marker-end="url(#arG)"/>
<text x="654" y="489" font-size="15" class="cap" fill="#059669">C4 技能可見性 · 專案根</text>

<!-- L1 共享層 -->
<rect x="440" y="500" width="400" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="440" y="500" width="6" height="100" rx="3" fill="#059669"/>
<text x="464" y="530" font-size="21" class="t">L1 共享層</text>
<text x="464" y="556" font-size="16" class="b">身分索引 · 跨場景看板 · 待辦 · 衝突簿 · 工作流（★ 計畫）</text>
<text x="464" y="582" font-size="15" fill="#059669" font-weight="600">唯一合法的跨場景通道</text>

<!-- 左下：單一真源 -->
<rect x="56" y="500" width="330" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="56" y="500" width="6" height="240" rx="3" fill="#7c3aed"/>
<text x="80" y="530" font-size="19" class="t">單一真源判據</text>
<text x="80" y="562" font-size="15" class="b">每個東西只屬於一層，</text>
<text x="80" y="586" font-size="15" class="b">只在一個地方是真源；</text>
<text x="80" y="610" font-size="15" class="b">其他地方只放指針。</text>
<text x="80" y="642" font-size="14" fill="#7c3aed" font-weight="600">一破這條 ⇒ 看板分裂、數字打架</text>
<line x1="80" y1="662" x2="362" y2="662" class="sep"/>
<text x="80" y="690" font-size="15" class="b">§₀ 只回答四問：我是誰／</text>
<text x="80" y="714" font-size="15" class="b">幹到哪／下一步／卡在哪</text>
<path d="M386 550 H434" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arP)"/>

<!-- 右下：機械不變量 -->
<rect x="894" y="500" width="330" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="894" y="500" width="6" height="240" rx="3" fill="#b45309"/>
<text x="918" y="530" font-size="19" class="t">機械不變量</text>
<text x="918" y="562" font-size="15" class="b">· §₀ ≤ 4 KB 紅線</text>
<text x="918" y="586" font-size="15" class="b">· 定位卡 sha256 指紋</text>
<text x="918" y="610" font-size="15" class="b">· 五小節缺一即擋</text>
<text x="918" y="642" font-size="14" fill="#b45309" font-weight="600">fail-closed：不過就擋住，不是提醒</text>
<line x1="918" y1="662" x2="1200" y2="662" class="sep"/>
<text x="918" y="690" font-size="15" class="b">校驗工具必須能證明</text>
<text x="918" y="714" font-size="15" class="b">「該失敗時會失敗」</text>
<path d="M894 550 H846" stroke="#b45309" stroke-width="2.5" marker-end="url(#arA)"/>

<!-- C5 / C6 -->
<path d="M470 600 V640" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arS)"/>
<text x="484" y="626" font-size="14" class="cap" fill="#0284c7">C5 派單（RPC／留言）</text>
<path d="M810 640 V606" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arP)"/>
<text x="796" y="626" font-size="14" class="cap" fill="#7c3aed" text-anchor="end">C6 回執（三件套）</text>

<!-- L3 工具層 -->
<rect x="440" y="640" width="400" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="440" y="640" width="6" height="100" rx="3" fill="#0284c7"/>
<text x="464" y="670" font-size="21" class="t">L3 執行與工具層</text>
<text x="464" y="696" font-size="16" class="b">校驗 check / stamp / 交接 · 建會話 · 發訊息 · 派單</text>
<text x="464" y="722" font-size="15" fill="#0284c7" font-weight="600">★ 工具放在資料之外 —— 升級不破壞資料</text>

<!-- L2′ 執行層（主控端私有） -->
<path d="M640 740 V768" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arA)"/>
<text x="654" y="762" font-size="14" class="cap" fill="#b45309">C9 執行狀態私有</text>
<rect x="440" y="768" width="400" height="80" rx="14" fill="#fffdf5" stroke="#fcd34d" filter="url(#sh)"/>
<rect x="440" y="768" width="6" height="80" rx="3" fill="#b45309"/>
<text x="464" y="798" font-size="21" class="t">L2′ 執行層（主控端私有）</text>
<text x="464" y="822" font-size="15" class="b">執行/&lt;run-id&gt;/：執行狀態（跑到哪）· 交接串（可累積物往下傳）</text>
<text x="464" y="841" font-size="13" fill="#b45309" font-weight="600">★ 計畫在 L1（共享），狀態在這裡（私有）</text>

<!-- C7 / C8 -->
<path d="M640 848 V878" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="654" y="868" font-size="15" class="cap" fill="#64748b">C10 稽核（git log）</text>

<!-- L4 / L5 -->
<rect x="440" y="878" width="400" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
<rect x="440" y="878" width="6" height="80" rx="3" fill="#64748b"/>
<text x="464" y="908" font-size="21" class="t">L4 稽核層 · L5 歸檔層</text>
<text x="464" y="936" font-size="16" class="b">git log 全在 · 交接前快照 · 只進不改，可恢復</text>

<!-- 底部總結 -->
<rect x="56" y="985" width="1168" height="140" rx="14" fill="#0f172a" filter="url(#sh)"/>
<text x="640" y="1033" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">累積要有載體，載體要能改寫；派單要帶回累積物，回執要能被驗收</text>
<text x="640" y="1075" font-size="18" fill="#cbd5e1" text-anchor="middle">能力不在模型裡，在累積裡 —— 聰明是模型給的，本事是自己養的</text>
<text x="640" y="1107" font-size="15" fill="#94a3b8" text-anchor="middle">記憶在檔案裡，不在會話裡 —— 這是累積能發生的前提</text>
</svg>
